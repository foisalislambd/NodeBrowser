name: CI

on:
  pull_request:
    branches: [main, master]
  # main pushes are covered by release.yml (build + publish)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EM_VERSION: '3.1.74'

jobs:
  wasm-boot:
    name: WASM boot + API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Install CMake / Ninja / g++
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: command -v emcc && command -v emcmake && emcc -v

      - name: Build C++ → WASM + TypeScript API
        run: bash scripts/ci-build-cpp-wasm.sh

      - name: API conformance (WASM boot)
        run: npm run test:api

      - name: Assert WASM kernel shipped
        run: |
          test -f packages/api/wasm/browsernode_kernel.wasm
          test -f packages/api/wasm/browsernode_kernel.js
          test -f packages/api/dist/index.js
          test ! -f packages/api/src/kernel/js-runtime.ts
          test ! -f packages/api/dist/kernel/js-runtime.js

      - name: Build demo
        run: npm run build:demo

      - name: Assert demo ships C++ WASM
        run: |
          test -f demo/dist/packages/api/wasm/browsernode_kernel.wasm
          test -f demo/dist/packages/api/dist/index.js

      - name: Playwright bake-off (Chromium + WASM)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  native:
    name: Native kernel tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Fetch QuickJS if needed
        run: bash scripts/fetch-deps.sh || true

      - name: Native tests
        run: npm run build:native
