name: CI

on:
  pull_request:
    branches: [main, master]
  # main pushes are covered by release.yml (build + publish)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-demo:
    name: API + demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Build API
        run: npm run build:api

      - name: API conformance (Phase 13)
        run: npm run test:api

      - name: Build demo
        run: npm run build:demo

  native:
    name: Native kernel tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Fetch QuickJS if needed
        run: bash scripts/fetch-deps.sh || true

      - name: Native tests
        run: npm run build:native
