name: GitHub Pages

# Build C++ → WASM, then self-contained demo → GitHub Pages.
# Site: https://foisalislambd.github.io/NodeBrowser/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EM_VERSION: '3.1.74'

jobs:
  build:
    name: Build demo (C++/WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm deps
        run: npm install --no-fund --no-audit

      - name: Install CMake / Ninja / g++
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: command -v emcc && command -v emcmake && emcc -v

      - name: Build C++ → WASM + TypeScript API
        run: bash scripts/ci-build-cpp-wasm.sh

      - name: Build demo
        run: npm run build:demo

      - name: Assert demo ships C++ WASM
        run: |
          test -f demo/dist/packages/api/wasm/browsernode_kernel.wasm
          test -f demo/dist/packages/api/dist/index.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
