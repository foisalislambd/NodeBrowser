version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      demo-templates:
        patterns:
          - '*'
        exclude-patterns:
          - 'esbuild-wasm'
          - 'typescript'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
