<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrowserNode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <h1>BrowserNode</h1>
      </div>
      <p class="tag">Runs in this tab (VFS) — no remote Node server</p>
    </header>

    <main class="stage">
      <section class="pane files-pane">
        <div class="pane-head">
          <span>files</span>
          <div class="actions">
            <button type="button" id="btn-fs-refresh" class="btn" title="Refresh">↻</button>
            <button type="button" id="btn-fs-newfile" class="btn" title="New file">+ file</button>
            <button type="button" id="btn-fs-newdir" class="btn" title="New folder">+ dir</button>
            <button type="button" id="btn-fs-delete" class="btn" title="Delete">del</button>
          </div>
        </div>
        <div id="file-tree" class="file-tree" role="tree" aria-label="VFS file tree"></div>
        <div class="cwd-bar">
          <span class="cwd-label">cwd</span>
          <code id="cwd-path">/home/project</code>
        </div>
      </section>

      <section class="pane editor-pane">
        <div class="pane-head">
          <span id="editor-path">/home/project/index.js</span>
          <div class="actions">
            <button type="button" id="btn-save" class="btn">Save</button>
            <button type="button" id="btn-run" class="btn primary">Run</button>
            <button type="button" id="btn-install" class="btn">Install</button>
            <button type="button" id="btn-http" class="btn">HTTP</button>
            <button type="button" id="btn-bundle" class="btn">Bundle</button>
          </div>
        </div>
        <div class="app-bar" aria-label="Templates">
          <span class="app-bar-label">Templates</span>
          <div class="actions">
            <button type="button" id="btn-vite-load" class="btn">Load Vite</button>
            <button type="button" id="btn-vite-preview" class="btn">Vite preview</button>
            <button type="button" id="btn-next-load" class="btn">Load Next</button>
            <button type="button" id="btn-next-preview" class="btn">Next preview</button>
          </div>
        </div>
        <textarea id="editor" spellcheck="false" aria-label="Source editor"></textarea>
      </section>

      <section class="pane term-pane">
        <div class="pane-head"><span>terminal</span><span id="status" class="status">booting…</span></div>
        <pre id="term" class="term" aria-live="polite"></pre>
      </section>

      <section class="pane preview-pane">
        <div class="pane-head"><span>preview</span><span id="preview-url" class="status"></span></div>
        <iframe id="preview" title="Preview" sandbox="allow-scripts allow-same-origin"></iframe>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "esbuild-wasm": "/node_modules/esbuild-wasm/esm/browser.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
